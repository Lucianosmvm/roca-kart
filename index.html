<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#216C79">
<title>Roça Kart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#203B43; --cream:#FFF0CF; --orange:#E87578; --green:#216C79; --gold:#E9C46A; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#9fd8ff; font-family:'Nunito',system-ui,sans-serif;
               user-select:none; -webkit-user-select:none; touch-action:none; -webkit-touch-callout:none; }
  #game canvas { display:block; }
  .hidden { display:none !important; }
  button { font:inherit; }

  /* ---------- HUD ---------- */
  .hud { position:fixed; pointer-events:none; color:#fff; font-family:'Lilita One',sans-serif; z-index:3;
         text-shadow: 3px 3px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink); }
  #pos { left:max(24px,env(safe-area-inset-left)); bottom:max(18px,env(safe-area-inset-bottom)); font-size:104px; line-height:.85; color:var(--gold); transform:rotate(-5deg); }
  #pos small { font-size:40px; vertical-align:top; } #pos .posTotal { display:block; font-size:16px; color:var(--cream); margin-top:9px; transform:rotate(5deg); }
  #lap { right:max(24px,env(safe-area-inset-right)); top:max(20px,env(safe-area-inset-top)); display:flex; align-items:center; gap:8px; font-size:44px; }
  #lap .hudLabel { font-size:14px; text-transform:uppercase; } #lap small { font-size:26px; }
  #time { left:max(24px,env(safe-area-inset-left)); top:max(24px,env(safe-area-inset-top)); display:flex; align-items:center; gap:7px; font-size:32px; color:var(--gold); font-variant-numeric:tabular-nums; }
  .hudClock { font-size:34px; }
  #coins { right:25%; top:max(25px,env(safe-area-inset-top)); display:flex; align-items:center; gap:6px; font-size:34px; color:var(--gold); }
  #item { left:50%; transform:translateX(-50%) rotate(-5deg); top:max(18px,env(safe-area-inset-top)); width:76px; height:76px; border-radius:16px; background:linear-gradient(150deg,#FFF9E9dd,#E9C46Acc); border:3px solid var(--ink);
          display:flex; align-items:center; justify-content:center; font-size:46px; text-shadow:none; box-shadow:0 4px 0 var(--ink),inset 0 0 0 2px #FFF0CF; }
  #item:empty::after { content:'?'; color:#216C7966; font-size:38px; }
  #itemName { left:50%; transform:translateX(-50%); top:104px; max-width:180px; text-align:center; font-size:16px; }
  #minimap { right:max(18px,env(safe-area-inset-right)); top:34%; width:170px; height:170px; background:none; border:0; }
  #standings { left:max(22px,env(safe-area-inset-left)); top:28%; display:flex; flex-direction:column; gap:8px; list-style:none; margin:0; padding:0; }
  .standing { display:flex; align-items:center; gap:9px; height:49px; font-size:20px; }
  .standingPortrait { position:relative; flex-shrink:0; width:50px; height:49px; background:linear-gradient(135deg,var(--racer-color),#203B43); border:2px solid var(--cream); border-radius:9px; box-shadow:2px 3px 0 var(--ink); transform:rotate(-5deg); }
  .standingPortrait img { width:100%; height:100%; object-fit:contain; }
  .standingRank { position:absolute; left:-9px; bottom:-4px; color:var(--cream); font-size:24px; }
  .standingName { max-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:'Nunito',sans-serif; font-size:12px; font-weight:900; }
  .standing.is-player .standingPortrait { border-color:var(--gold); box-shadow:0 0 0 2px var(--ink),0 0 10px #E9C46A99; }
  .standing.is-player .standingName { color:var(--gold); }
  #speed { right:max(18px,env(safe-area-inset-right)); bottom:max(14px,env(safe-area-inset-bottom)); width:180px; height:154px; text-shadow:none; }
  .speedDial { display:block; width:100%; height:auto; filter:drop-shadow(1px 2px 0 #203B4388); }
  #speedNeedle { stroke:var(--gold); stroke-width:5; stroke-linecap:round; }
  .speedReadout { position:absolute; right:12px; bottom:29px; min-width:66px; padding:2px 6px; border:2px solid var(--cream); border-radius:7px; color:var(--ink); background:var(--cream); text-align:center; line-height:1; }
  #speedValue { font-family:'Lilita One'; font-size:27px; font-weight:400; font-variant-numeric:tabular-nums; }
  .speedReadout small { display:block; font-family:'Nunito'; font-weight:900; font-size:9px; }
  .boostTrack { position:absolute; left:13px; right:13px; bottom:2px; height:13px; border:2px solid var(--cream); border-radius:5px; background:#203B43cc; overflow:hidden; }
  #boostFill { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--green),var(--gold),var(--orange)); }
  #speed.boosting .boostTrack { box-shadow:0 0 12px #E9C46Acc; }
  #msg { left:0; right:0; top:28%; text-align:center; font-size:120px; }
  #msg.pop { animation: pop .35s ease-out; }
  @keyframes pop { from { transform:scale(1.6); opacity:0; } to { transform:scale(1); opacity:1; } }
  #sub { left:0; right:0; top:46%; text-align:center; font-size:34px; }
  #abil { left:max(24px,env(safe-area-inset-left)); bottom:142px; display:flex; align-items:center; gap:8px; pointer-events:auto; cursor:pointer; font-size:28px; text-shadow:none; }
  #abil .bar { width:120px; height:16px; border:4px solid var(--ink); border-radius:10px; background:rgba(255,246,220,.85); overflow:hidden; }
  #abil .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#216C79,#E9C46A); transition:width .2s; }
  #abil kbd { font-size:14px; }
  #abil.full .bar i { background:linear-gradient(90deg,#E87578,#FFF0CF); }
  #abil.full, .tbtn.full { animation: pulse .6s infinite alternate; }
  @keyframes pulse { from { transform:scale(1); } to { transform:scale(1.1); } }
  #pauseBtn { position:fixed; right:max(24px,env(safe-area-inset-right)); top:84px; z-index:4; width:42px; height:42px; border-radius:12px;
              border:4px solid var(--ink); background:rgba(255,246,220,.85); font-size:24px; box-shadow:3px 3px 0 var(--ink); cursor:pointer; }
  #help { left:50%; transform:translateX(-50%); bottom:14px; font-family:'Nunito'; font-weight:900; font-size:13px; text-shadow:none;
          color:var(--ink); background:rgba(255,246,220,.8); padding:6px 14px; border-radius:20px; white-space:nowrap; }
  #speedlines { position:fixed; inset:0; pointer-events:none; z-index:2; opacity:0; transition:opacity .25s;
    background: repeating-conic-gradient(from 0deg at 50% 55%, rgba(255,255,255,0) 0deg 3deg, rgba(255,255,255,.55) 3deg 3.6deg, rgba(255,255,255,0) 3.6deg 9deg);
    -webkit-mask: radial-gradient(circle at 50% 55%, transparent 32%, #000 70%); mask: radial-gradient(circle at 50% 55%, transparent 32%, #000 70%); }
  #vignette { position:fixed; inset:0; pointer-events:none; z-index:2; background:radial-gradient(ellipse at center, transparent 60%, rgba(40,20,5,.35) 100%); }
  #fade { position:fixed; inset:0; background:#2b1a0e; z-index:50; opacity:0; pointer-events:none; transition:opacity .35s; }
  #fade.on { opacity:1; pointer-events:auto; }

  /* touch */
  #touch { position:fixed; inset:auto 0 0 0; height:0; z-index:5; display:none; }
  body.is-touch #touch { display:block; }
  body.is-touch #help, body.is-touch .keysOnly { display:none !important; }
  .tbtn { position:fixed; width:92px; height:92px; border-radius:50%; border:5px solid var(--ink); background:rgba(255,246,220,.82);
          box-shadow:4px 4px 0 var(--ink); font-family:'Lilita One'; font-size:34px; color:var(--ink); display:flex; align-items:center;
          justify-content:center; pointer-events:auto; touch-action:none; }
  .tbtn.on { background:#ffe08a; transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink); }
  #tLeft { left:18px; bottom:110px; } #tRight { left:124px; bottom:110px; }
  #tBrake { right:18px; bottom:110px; width:74px; height:74px; font-size:16px; }
  #tDrift { right:104px; bottom:96px; background:rgba(79,195,247,.85); font-size:18px; }
  #tItem { right:60px; bottom:200px; background:rgba(232,117,120,.9); font-size:18px; }
  #tAbil { right:150px; bottom:200px; background:rgba(33,108,121,.9); font-size:18px; }
  #tHorn { right:196px; bottom:110px; width:62px; height:62px; font-size:26px; }
  body.is-touch #abil kbd { display:none; }

  /* ---------- screens ---------- */
  .screen { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:safe center;
            overflow-y:auto; padding:18px 12px; }
  .screen.dim { background:radial-gradient(ellipse at center,rgba(255,240,207,.24),rgba(20,48,54,.8)); }
  .logo { font-family:'Lilita One'; font-size:clamp(60px,12vw,150px); margin:0; color:var(--orange); line-height:1; letter-spacing:2px;
          text-shadow: 6px 6px 0 var(--ink), -3px -3px 0 var(--ink), 3px -3px 0 var(--ink), -3px 3px 0 var(--ink); transform:rotate(-4deg); }
  .logo span { display:inline-block; animation: bounce 1.6s ease-in-out infinite; }
  @keyframes bounce { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
  .tag { font-family:'Lilita One'; color:var(--cream); font-size:clamp(18px,3vw,28px); text-shadow:3px 3px 0 var(--ink); margin:8px 0 18px; text-align:center; }
  h2.title { font-family:'Lilita One'; color:var(--cream); font-size:clamp(34px,6vw,56px); margin:0 0 12px; text-shadow:4px 4px 0 var(--ink); font-weight:400; }
  .btn { pointer-events:auto; font-family:'Lilita One'; font-size:28px; padding:12px 34px; border-radius:18px; cursor:pointer; color:#fff;
         background:linear-gradient(180deg,#318794,var(--green)); border:3px solid var(--ink); box-shadow:0 4px 0 var(--ink),inset 0 2px 0 #ffffff55; transition:transform .08s; }
  .btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 6px 0 var(--ink),inset 0 2px 0 #ffffff55; }
  .btn:active:not(:disabled) { transform:translateY(2px); box-shadow:0 2px 0 var(--ink),inset 0 1px 0 #ffffff44; }
  .btn.orange { background:linear-gradient(180deg,#F49C94,var(--orange)); } .btn.blue { background:linear-gradient(180deg,#438A98,#246173); } .btn.cream { background:linear-gradient(180deg,#FFF9E9,var(--cream)); color:var(--ink); }
  .btn:focus-visible, .tab:focus-visible { outline:3px solid var(--gold); outline-offset:4px; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn.small { font-size:20px; padding:8px 20px; border-width:3px; }
  .menuBtns { display:grid; grid-template-columns:repeat(2, minmax(200px, 260px)); gap:14px; margin-top:8px; }
  .menuBtns .btn.big { grid-column: span 2; font-size:40px; }
  .panel { background:linear-gradient(155deg,#FFF8E8,var(--cream)); border:3px solid var(--ink); border-radius:20px; box-shadow:5px 5px 0 var(--ink);
           padding:16px 20px; color:var(--ink); }
  .coinsBadge { position:fixed; top:14px; right:18px; z-index:12; font-family:'Lilita One'; font-size:28px; color:var(--ink);
                background:var(--cream); border:3px solid var(--ink); border-radius:16px; padding:4px 14px; box-shadow:0 3px 0 var(--ink); }
  .backRow { display:flex; gap:14px; margin-top:16px; flex-wrap:wrap; justify-content:center; }
  .stats { font-weight:900; color:var(--cream); text-shadow:2px 2px 0 var(--ink); margin-top:14px; }

  /* splash */
  #splash .bar { width:min(420px,80vw); height:24px; border:5px solid var(--ink); border-radius:14px; background:var(--cream); overflow:hidden; margin-top:22px; }
  #splash .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--orange),var(--gold)); transition:width .2s; }
  #splash .tap { margin-top:24px; font-family:'Lilita One'; font-size:30px; color:#fff; text-shadow:3px 3px 0 var(--ink); animation:pulse .7s infinite alternate; cursor:pointer; }
  #splash .credit { position:fixed; bottom:12px; font-weight:900; color:var(--cream); text-shadow:2px 2px 0 var(--ink); font-size:14px; text-align:center; }
  #splash { background:radial-gradient(ellipse at center,#FFF0CF 0%,#6AA7A9 48%,#205D68 100%); }
  .splashMachines { display:flex; gap:10px; margin-top:16px; }
  .splashMachines img { width:min(150px,26vw); border-radius:16px; border:4px solid var(--ink); box-shadow:4px 4px 0 var(--ink); animation: bounce 2s ease-in-out infinite; }
  .splashMachines img:nth-child(2) { animation-delay:.25s; } .splashMachines img:nth-child(3) { animation-delay:.5s; }

  /* cards (tracks) */
  .cards { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  .card { pointer-events:auto; cursor:pointer; width:230px; border-radius:18px; border:3px solid var(--ink); background:linear-gradient(155deg,#FFF8E8,var(--cream));
          box-shadow:5px 5px 0 var(--ink); padding:10px; display:flex; flex-direction:column; align-items:center; color:var(--ink); transition:transform .1s; }
  .card:hover { transform:translateY(-3px); }
  .card.sel { background:linear-gradient(#FFE7A4,#F1CD74); transform:translateY(-4px); box-shadow:0 7px 0 var(--ink); }
  .card canvas { width:100%; border-radius:12px; }
  .card b { font-family:'Lilita One'; font-size:24px; font-weight:400; margin-top:6px; text-align:center; }
  .card small { font-weight:900; font-size:13px; opacity:.8; text-align:center; }
  .card .diff { font-size:18px; margin-top:4px; }
  .card .best { font-size:13px; font-weight:900; margin-top:4px; }

  /* garage / shop overlay on the 3D showroom */
  #garage, #shop { display:grid; grid-template-columns:minmax(0,1fr) clamp(340px,34vw,460px); grid-template-rows:auto minmax(0,1fr) auto; height:100dvh; justify-content:normal; align-items:stretch; padding:0; overflow:hidden; pointer-events:none; }
  .gHeader { grid-column:1/-1; grid-row:1; display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; gap:14px; align-items:center; padding:12px 18px; padding-top:max(12px,env(safe-area-inset-top)); color:var(--cream); background:linear-gradient(180deg,#318794,#205D68); border-bottom:3px solid var(--ink); pointer-events:auto; }
  .gBrand { display:flex; align-items:center; flex-wrap:wrap; gap:8px 18px; min-width:0; }
  .gBrand h2 { margin:0; font-family:'Lilita One'; font-size:clamp(20px,2.3vw,32px); font-weight:400; line-height:1.1; text-shadow:0 2px 0 var(--ink); }
  .gGameName { font-family:'Lilita One'; white-space:nowrap; font-size:22px; background:linear-gradient(#A57447,#82532F); border:3px solid #674329; padding:6px 10px; border-radius:12px; box-shadow:inset 0 2px 0 #ffffff44; text-shadow:0 2px 0 #674329; }
  .gMainNav { display:flex; gap:8px; }
  .gMainNav .tab { font-size:18px; white-space:nowrap; }
  .gWallet { border:3px solid var(--ink); padding:5px 12px; border-radius:14px; background:var(--cream); color:var(--ink); white-space:nowrap; font-family:'Lilita One'; font-size:24px; }
  .gPreview { grid-column:1; grid-row:2; position:relative; min-height:0; min-width:0; }
  .gRotateHint { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); padding:7px 18px; border:2px solid var(--ink); border-radius:18px; font-size:14px; font-weight:900; color:var(--ink); background:#FFF0CFee; white-space:nowrap; }
  .gPanel { grid-column:2; grid-row:2; display:flex; flex-direction:column; min-height:0; min-width:0; width:auto; max-height:none; margin:0; padding:0; overflow:hidden; border-radius:22px 0 0 22px; border:3px solid #D5B98D; border-right:0; box-shadow:-4px 0 0 #203B4333; pointer-events:auto; }
  .gEditorBody { min-height:0; overflow-y:auto; padding:16px; overscroll-behavior:contain; touch-action:pan-y; scrollbar-color:#BCA078 #FFF0CF; }
  .gEditingTitle { margin:0 0 12px; color:#205D68; font-family:'Lilita One'; font-size:28px; font-weight:400; line-height:1.1; }
  .gSheetToggle { display:none; }
  .gFooter { grid-column:1/-1; grid-row:3; display:flex; align-items:center; gap:16px; padding:12px 20px; padding-bottom:max(12px,env(safe-area-inset-bottom)); border-top:3px solid var(--ink); background:linear-gradient(180deg,#287B87,#205D68); pointer-events:auto; }
  .gFooter .btn { padding:10px 24px; font-size:24px; }
  .gFooter #gGo { font-size:30px; min-width:210px; border-color:#FFF0CF; box-shadow:0 3px 0 var(--ink),inset 0 2px 0 #ffffff66; }
  .gSaveStatus { flex:1; font-weight:900; color:var(--cream); font-size:14px; }
  .gCatalog, .gAttributes { border:2px solid #D5B98D; border-radius:12px; margin:10px 0; background:#FFF8E8; }
  .gCatalog summary, .gAttributes summary { display:flex; justify-content:space-between; gap:8px; cursor:pointer; padding:9px 11px; font-weight:900; font-size:14px; list-style:none; }
  .gCatalog summary::-webkit-details-marker, .gAttributes summary::-webkit-details-marker { display:none; }
  .gCatalog .tabs { padding:4px 10px 10px; margin:0; }
  .gAttributes .gInfo { padding:0 12px 12px; }
  .gAttributes[open] summary span { transform:rotate(90deg); }
  .gBuyBox { padding:12px; margin-top:12px; border:2px solid var(--orange); border-radius:12px; background:#FFF8E8; }
  .gEditorTip { padding:20px 14px; background:#E1F0E9; border:2px solid #A6C9C6; border-radius:14px; font-size:14px; line-height:1.6; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .tab { font-family:'Lilita One'; font-size:20px; padding:6px 16px; border-radius:14px; border:4px solid var(--ink); background:#fff; cursor:pointer; color:var(--ink); }
  .tab.on { background:var(--orange); color:#fff; } .tab:disabled { opacity:.35; cursor:not-allowed; }
  .items { display:flex; gap:10px; overflow-x:auto; padding:6px 2px 10px; touch-action:pan-x; }
  .it { flex:0 0 auto; width:128px; border-radius:14px; border:4px solid var(--ink); background:#fff; cursor:pointer; padding:8px 6px;
        display:flex; flex-direction:column; align-items:center; gap:4px; font-weight:900; font-size:13px; text-align:center; color:var(--ink); }
  .it .sw { width:56px; height:56px; border-radius:50%; border:4px solid var(--ink); }
  .it .ic { font-size:40px; line-height:56px; } .it img { width:100%; height:64px; object-fit:contain; border-radius:8px; }
  .it.sel { background:#ffe08a; box-shadow:0 0 0 4px var(--orange); } .it.locked { background:#eee; }
  .it .price { font-family:'Lilita One'; font-weight:400; font-size:16px; color:#b06a00; }
  .gInfo { display:flex; gap:16px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .gInfo .statsBox { display:grid; grid-template-columns:auto auto; gap:2px 10px; font-weight:900; font-size:14px; }
  .gInfo em { font-style:normal; color:#e08a00; letter-spacing:1px; }
  .abilTag { display:inline-block; font-weight:900; background:#fff; border:3px solid var(--ink); border-radius:12px; padding:2px 10px; margin-top:4px; }
  .buildIntro { font-size:13px; margin:4px 0 12px; }
  .buildGrid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px 18px; }
  .buildGrid label { display:flex; flex-direction:column; gap:4px; font-size:13px; font-weight:900; }
  .partGroups { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-bottom:16px; }
  .partGroup { border:0; padding:0; margin:0; min-width:0; }
  .partGroup legend { padding:0; margin-bottom:6px; font-size:15px; font-weight:900; }
  .partOptions { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
  .partOption { position:relative; cursor:pointer; min-width:0; }
  .partOption input { position:absolute; opacity:0; width:1px; height:1px; }
  .partCard { display:flex; height:100%; flex-direction:column; align-items:center; background:#fffaf0; border:3px solid #c8d2cd; border-radius:12px; padding:5px 3px; text-align:center; transition:border-color .12s,background .12s; }
  .partDrawing { width:100%; max-width:128px; height:64px; display:block; }
  .partLabel { font-size:11px; font-weight:900; line-height:1.25; }
  .partSelected { font-size:9px; font-weight:900; color:var(--green); visibility:hidden; margin-top:auto; padding-top:4px; }
  .partOption:hover .partCard { border-color:var(--green); }
  .partOption input:checked + .partCard { border-color:var(--green); background:#e1f0e9; box-shadow:0 0 0 1px var(--green); }
  .partOption input:checked + .partCard .partSelected { visibility:visible; }
  .partOption input:focus-visible + .partCard { outline:3px solid var(--orange); outline-offset:3px; }
  .buildGrid input[type=range] { width:100%; min-height:24px; accent-color:var(--green); touch-action:pan-y; }
  .buildGrid output { font-size:11px; color:var(--green); }
  .buildColor input { width:100%; height:30px; padding:1px; border:2px solid var(--ink); border-radius:6px; cursor:pointer; }
  .buildActions { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:12px 0; }
  .buildActions .btn { font-size:15px; padding:7px 12px; }
  .buildTargets { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin:6px 0 12px; }
  .buildTargets small { flex:1 1 200px; font-size:12px; }
  .brotoParts { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .creationForm { display:flex; align-items:flex-end; flex-wrap:wrap; gap:10px; margin:10px 0; }
  .creationForm label { flex:1 1 200px; display:flex; flex-direction:column; gap:6px; font-weight:900; font-size:14px; }
  .creationForm input { width:100%; padding:10px 12px; border:3px solid var(--ink); border-radius:10px; font:inherit; color:var(--ink); background:#fff; user-select:text; touch-action:auto; }
  .creationNotice { font-size:13px; min-height:1.5em; }

<body>
<div id="game"></div>
<div id="vignette"></div>
<div id="speedlines"></div>

<!-- HUD -->
<div class="hud" id="item"></div>
<div class="hud" id="itemName"></div>
<div class="hud" id="abil"><span id="abilIcon"></span><div class="bar"><i id="abilFill"></i></div><kbd>Q</kbd></div>
<canvas class="hud" id="minimap" width="170" height="170"></canvas>
<div class="hud" id="lap"><span class="hudLabel">Volta</span><span id="lapValue">1<small>/3</small></span></div>
<div class="hud" id="time"><span class="hudClock" aria-hidden="true">⏱</span><span id="timeValue">0:00.00</span></div>
<div class="hud" id="coins"><span aria-hidden="true">🌽</span><span id="coinValue">×0</span></div>
<ol class="hud" id="standings" aria-label="Quatro primeiros colocados"></ol>
<div class="hud" id="pos"></div>
<div class="hud" id="speed" aria-label="Velocidade">
  <svg class="speedDial" viewBox="0 0 200 145" aria-hidden="true" focusable="false">
    <path d="M25 115a75 75 0 0 1 150 0" fill="none" stroke="#203B43" stroke-width="18"/>
    <path d="M25 115a75 75 0 0 1 150 0" fill="none" stroke="#FFF0CF" stroke-width="13"/>
    <g fill="none" stroke-width="8">
      <path d="M25 115a75 75 0 0 1 150 0" pathLength="100" stroke="#216C79" stroke-dasharray="45 55"/>
      <path d="M25 115a75 75 0 0 1 150 0" pathLength="100" stroke="#E9C46A" stroke-dasharray="30 70" stroke-dashoffset="-45"/>
      <path d="M25 115a75 75 0 0 1 150 0" pathLength="100" stroke="#E87578" stroke-dasharray="25 75" stroke-dashoffset="-75"/>
    </g>
    <g stroke="#FFF0CF" stroke-width="2"><path d="m25 115h12m-6-28 11 5m4-30 9 9m17-26 4 12m24-17v13m29-7-5 12m29 4-9 9m25 16-11 5m17 23h-12"/></g>
    <path id="speedNeedle" d="M100 115H36"/>
    <circle cx="100" cy="115" r="6" fill="#FFF0CF" stroke="#203B43" stroke-width="2"/>
  </svg>
  <div class="speedReadout"><span id="speedValue">0</span><small>km/h</small></div>
  <div class="boostTrack" role="meter" aria-label="Turbo ativo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="boostFill"></i></div>
</div>
<div class="hud" id="msg"></div>
<div class="hud" id="sub"></div>
<div class="hud" id="help">W/↑ acelera · S/↓ freia · A/D vira · ESPAÇO drift/manobra · E item · Q habilidade · H buzina · ESC pausa</div>
<button id="pauseBtn" aria-label="Pausar">⏸</button>
<div id="touch">
  <div class="tbtn" id="tLeft" data-k="ArrowLeft">◀</div>
  <div class="tbtn" id="tRight" data-k="ArrowRight">▶</div>
  <div class="tbtn" id="tItem" data-k="KeyE">ITEM</div>
  <div class="tbtn" id="tAbil" data-k="KeyQ">HAB</div>
  <div class="tbtn" id="tDrift" data-k="Space">DRIFT</div>
  <div class="tbtn" id="tBrake" data-k="ArrowDown">FREIO</div>
  <div class="tbtn" id="tHorn" data-k="KeyH">📯</div>
</div>

<!-- screens (filled by ui.js) -->
<div class="screen" id="splash"></div>
<div class="screen dim hidden" id="menu"></div>
<div class="screen dim hidden" id="tracks"></div>
<div class="screen hidden" id="garage"></div>
<div class="screen hidden" id="shop"></div>
<div class="screen dim hidden" id="options"></div>
<div class="screen dim hidden" id="credits"></div>
<div class="screen dim hidden" id="pause"></div>
<div class="screen hidden" id="results"></div>
<div class="screen hidden" id="cutscene"></div>
<div class="coinsBadge hidden" id="wallet"></div>
<div id="fade"></div>

</script>
